name: Feature request / 功能建议
description: Suggest a practical improvement / 改进建议
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do? / 想解决什么问题？
      description: Describe the outcome you want and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior / 建议的操作方式
